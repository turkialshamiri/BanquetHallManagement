<mat-sidenav-container
  class="sidebar-container"
  [class.is-mobile]="layoutService.isMobile()"
  [class.is-open]="layoutService.sidebarOpen()">

  <mat-sidenav
    [mode]="sidenavMode"
    [opened]="sidenavOpened"
    (closedStart)="layoutService.closeSidebar()"
    class="sidebar">

    <div class="logo">

      <div class="logo-circle">
        🏛️
      </div>

      <h2>نظام إدارة القاعات</h2>

      <span>Hall Booking System</span>

    </div>

    <mat-accordion multi>

      <mat-expansion-panel
        *ngFor="let item of menuItems"
        class="menu-panel"
        [expanded]="isSectionActive(item)">

        <mat-expansion-panel-header>

          <div class="menu-header">

            <div class="menu-icon-wrapper">

              <mat-icon>
                {{ item.icon }}
              </mat-icon>

            </div>

            <span class="menu-title">
              {{ item.title }}
            </span>

          </div>

        </mat-expansion-panel-header>

        <div class="submenu">

          <a
            *ngFor="let child of item.children"
            [routerLink]="child.route"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: child.exact ?? true }"
            class="submenu-item"
            (click)="onNavClick(); $event.stopPropagation()">

            <div class="submenu-icon">

              <mat-icon>
                {{ child.icon }}
              </mat-icon>

            </div>

            <span class="submenu-title">
              {{ child.title }}
            </span>

          </a>

        </div>

      </mat-expansion-panel>

    </mat-accordion>

  </mat-sidenav>

</mat-sidenav-container>
