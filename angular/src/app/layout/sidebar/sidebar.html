<div class="logo">

  <div class="logo-circle">
    🏛️
  </div>

  <h2>{{ 'AppName' | appLocalization }}</h2>

</div>

<mat-accordion multi>

  <mat-expansion-panel
    *ngFor="let item of menuItems"
    class="menu-panel"
    [expanded]="isSectionActive(item)">

    <mat-expansion-panel-header>

      <div class="menu-header">

        <div class="menu-icon-wrapper">

          <mat-icon>
            {{ item.icon }}
          </mat-icon>

        </div>

        <span class="menu-title">
          {{ item.titleKey | appLocalization }}
        </span>

      </div>

    </mat-expansion-panel-header>

    <div class="submenu">

      <a
        *ngFor="let child of item.children"
        href="#"
        class="submenu-item"
        [class.active-link]="isRouteActive(child.route)"
        (click)="navigateTo(child.route); $event.preventDefault()">

        <div class="submenu-icon">

          <mat-icon>
            {{ child.icon }}
          </mat-icon>

        </div>

        <span class="submenu-title">
          {{ child.titleKey | appLocalization }}
        </span>

      </a>

    </div>

  </mat-expansion-panel>

</mat-accordion>
