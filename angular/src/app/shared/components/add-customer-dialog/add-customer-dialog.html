<div class="dialog-container">

    <h2>
        {{ isEditMode
            ? ('Customers:Dialog:EditTitle' | appLocalization)
            : ('Customers:Dialog:AddTitle' | appLocalization) }}
    </h2>

    <div class="form-group">

        <label>{{ 'Customers:Field:Name' | appLocalization }} <span class="required">*</span></label>

        <input
            type="text"
            [(ngModel)]="customer.name"
            (ngModelChange)="clearError('name')"
            [class.invalid]="errors.name">

        @if (errors.name) {
            <span class="error-message">{{ errors.name }}</span>
        }

    </div>

    <div class="form-group">

        <label>{{ 'Customers:Field:Phone' | appLocalization }} <span class="required">*</span></label>

        <input
            type="text"
            [(ngModel)]="customer.phone"
            (ngModelChange)="clearError('phone')"
            [class.invalid]="errors.phone">

        @if (errors.phone) {
            <span class="error-message">{{ errors.phone }}</span>
        }

    </div>

    <div class="form-group">

        <label>{{ 'Customers:Field:Company' | appLocalization }}</label>

        <input type="text" [(ngModel)]="customer.company">

    </div>

    <div class="actions">

        <button class="cancel-btn" type="button" (click)="close()">
            {{ 'Cancel' | appLocalization }}
        </button>

        <button class="save-btn" type="button" (click)="save()">
            {{ isEditMode
                ? ('Dialog:SaveChanges' | appLocalization)
                : ('Customers:Dialog:AddSubmit' | appLocalization) }}
        </button>

    </div>

</div>
