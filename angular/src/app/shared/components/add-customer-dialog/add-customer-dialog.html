<div class="dialog-container">

    <h2>

        {{ isEditMode
        ? 'تعديل العميل'
        : 'إضافة عميل جديد' }}

    </h2>

    <div class="form-group">

        <label>اسم العميل <span class="required">*</span></label>

        <input
            type="text"
            [(ngModel)]="customer.name"
            (ngModelChange)="clearError('name')"
            [class.invalid]="errors.name">

        @if (errors.name) {
            <span class="error-message">{{ errors.name }}</span>
        }

    </div>

    <div class="form-group">

        <label>رقم الهاتف <span class="required">*</span></label>

        <input
            type="text"
            [(ngModel)]="customer.phone"
            (ngModelChange)="clearError('phone')"
            [class.invalid]="errors.phone">

        @if (errors.phone) {
            <span class="error-message">{{ errors.phone }}</span>
        }

    </div>

    <div class="form-group">

        <label>اسم الشركة</label>

        <input
            type="text"
            [(ngModel)]="customer.company">

    </div>

    <div class="actions">

        <button class="cancel-btn" type="button" (click)="close()">

            إلغاء

        </button>

        <button class="save-btn" type="button" (click)="save()">

            {{ isEditMode
            ? 'حفظ التعديلات'
            : 'إضافة العميل' }}

        </button>

    </div>

</div>
