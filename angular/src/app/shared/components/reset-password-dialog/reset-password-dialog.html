<div class="dialog-container">

  <div class="dialog-header">

    <h2>{{ 'Users:ResetPassword:Title' | appLocalization }}</h2>

    <button type="button" class="close-btn" (click)="close()">×</button>

  </div>



  <p class="hint">{{ hintText }}</p>



  @if (apiError) {

    <div class="api-error">{{ apiError }}</div>

  }



  <div class="field">

    <label>{{ 'Users:ResetPassword:NewPassword' | appLocalization }}</label>

    <mat-form-field appearance="outline" class="password-field">

      <input

        matInput

        [type]="showPassword ? 'text' : 'password'"

        [(ngModel)]="newPassword"

        (input)="clearError('password')"

        autocomplete="new-password"

      />

      <button

        mat-icon-button

        matSuffix

        type="button"

        (click)="togglePasswordVisibility()"

        [attr.aria-label]="showPassword ? ('Users:HidePassword' | appLocalization) : ('Users:ShowPassword' | appLocalization)">

        <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>

      </button>

    </mat-form-field>

    @if (errors.password) {

      <div class="error">{{ errors.password }}</div>

    }

    <app-password-rules-hint [password]="newPassword"></app-password-rules-hint>

  </div>



  <div class="field">

    <label>{{ 'Users:ResetPassword:ConfirmPassword' | appLocalization }}</label>

    <mat-form-field appearance="outline" class="password-field">

      <input

        matInput

        [type]="showConfirmPassword ? 'text' : 'password'"

        [(ngModel)]="confirmPassword"

        (input)="clearError('confirmPassword')"

        autocomplete="new-password"

      />

      <button

        mat-icon-button

        matSuffix

        type="button"

        (click)="toggleConfirmPasswordVisibility()"

        [attr.aria-label]="showConfirmPassword ? ('Users:HideConfirmPassword' | appLocalization) : ('Users:ShowConfirmPassword' | appLocalization)">

        <mat-icon>{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>

      </button>

    </mat-form-field>

    @if (errors.confirmPassword) {

      <div class="error">{{ errors.confirmPassword }}</div>

    }

  </div>



  <div class="actions">

    <button type="button" class="cancel-btn" (click)="close()">{{ 'Cancel' | appLocalization }}</button>

    <button type="button" class="primary-btn" (click)="save()">{{ 'Save' | appLocalization }}</button>

  </div>

</div>
