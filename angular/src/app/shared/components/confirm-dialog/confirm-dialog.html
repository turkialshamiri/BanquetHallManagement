<div class="dialog-container" [class]="'dialog-container--' + data.type">

    <div class="icon-wrapper">
        <mat-icon>{{ data.icon }}</mat-icon>
    </div>

    <h2>{{ data.title }}</h2>

    <p class="message">
        {{ data.message }}
    </p>

    @if (data.warningMessage) {
        <p class="warning-message">
            {{ data.warningMessage }}
        </p>
    }

    <div class="actions">

        <button
            type="button"
            class="cancel-btn"
            (click)="cancel()">

            {{ data.cancelLabel }}

        </button>

        <button
            type="button"
            class="confirm-btn"
            (click)="confirm()">

            {{ data.confirmLabel }}

        </button>

    </div>

</div>
