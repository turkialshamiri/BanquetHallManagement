<div class="dialog-container">

    <h2>

        {{ isEditMode
        ? 'تعديل الخدمة'
        : 'إضافة خدمة جديدة' }}

    </h2>

    @if (apiError) {
        <div class="api-error">
            {{ apiError }}
        </div>
    }

    <div class="form-group">

        <label>اسم الخدمة <span class="required">*</span></label>

        <input
            type="text"
            [(ngModel)]="service.name"
            (ngModelChange)="clearError('name')"
            [class.invalid]="errors.name">

        @if (errors.name) {
            <span class="error-message">{{ errors.name }}</span>
        }

    </div>

    <div class="form-group">

        <label>السعر <span class="required">*</span></label>

        <input
            type="number"
            min="0"
            step="0.01"
            [(ngModel)]="service.price"
            (ngModelChange)="clearError('price')"
            [class.invalid]="errors.price">

        @if (errors.price) {
            <span class="error-message">{{ errors.price }}</span>
        }

    </div>

    <div class="actions">

        <button class="cancel-btn" type="button" (click)="close()">

            إلغاء

        </button>

        <button class="save-btn" type="button" (click)="save()">

            {{ isEditMode
            ? 'حفظ التعديلات'
            : 'إضافة الخدمة' }}

        </button>

    </div>

</div>
