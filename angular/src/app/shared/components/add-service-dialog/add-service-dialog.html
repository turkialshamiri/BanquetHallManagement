<div class="dialog-container">

    <h2>
        {{ isEditMode
            ? ('Services:Dialog:EditTitle' | appLocalization)
            : ('Services:Dialog:AddNewTitle' | appLocalization) }}
    </h2>

    @if (apiError) {
        <div class="api-error">{{ apiError }}</div>
    }

    <div class="form-group">

        <label>{{ 'Services:Field:Name' | appLocalization }} <span class="required">*</span></label>

        <input
            type="text"
            [(ngModel)]="service.name"
            (ngModelChange)="clearError('name')"
            [class.invalid]="errors.name">

        @if (errors.name) {
            <span class="error-message">{{ errors.name }}</span>
        }

    </div>

    <div class="form-group">

        <label>{{ 'Services:Field:Price' | appLocalization }} <span class="required">*</span></label>

        <input
            type="number"
            min="0"
            step="0.01"
            [(ngModel)]="service.price"
            (ngModelChange)="clearError('price')"
            [class.invalid]="errors.price">

        @if (errors.price) {
            <span class="error-message">{{ errors.price }}</span>
        }

    </div>

    <div class="actions">

        <button class="cancel-btn" type="button" (click)="close()">
            {{ 'Cancel' | appLocalization }}
        </button>

        <button class="save-btn" type="button" (click)="save()">
            {{ isEditMode
                ? ('Dialog:SaveChanges' | appLocalization)
                : ('Services:Dialog:AddSubmit' | appLocalization) }}
        </button>

    </div>

</div>
