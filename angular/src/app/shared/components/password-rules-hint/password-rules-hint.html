@if (visible) {
  <ul class="password-rules" aria-live="polite">
    @for (rule of rules; track rule.key) {
      <li [class.valid]="rule.valid" [class.invalid]="!rule.valid && password.length > 0">
        <span class="icon">{{ rule.valid ? '✓' : '○' }}</span>
        <span>{{ rule.label }}</span>
      </li>
    }
  </ul>
}
