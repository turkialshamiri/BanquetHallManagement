<div class="dialog-container">

    <h2>
        {{ isEditMode
            ? ('Halls:Dialog:EditTitle' | appLocalization)
            : ('Halls:Dialog:AddTitle' | appLocalization) }}
    </h2>

    <div class="form-group">

        <label>{{ 'Halls:Field:Name' | appLocalization }}</label>

        <input type="text" [(ngModel)]="hall.name">

    </div>

    <div class="form-group">

        <label>{{ 'Halls:Field:Description' | appLocalization }}</label>

        <textarea [(ngModel)]="hall.description"></textarea>

    </div>

    <div class="grid">

        <div class="form-group">

            <label>{{ 'Halls:Field:Capacity' | appLocalization }}</label>

            <input type="number" [(ngModel)]="hall.capacity">

        </div>

        <div class="form-group">

            <label>{{ 'Halls:Field:PricePerHour' | appLocalization }}</label>

            <input type="number" [(ngModel)]="hall.pricePerHour">

        </div>

    </div>

    <div class="form-group">

        <label>{{ 'Halls:Field:Location' | appLocalization }}</label>

        <input type="text" [(ngModel)]="hall.location">

    </div>

    <div class="grid">

        <div class="form-group">

            <label>{{ 'Halls:Field:Status' | appLocalization }}</label>

            <select [(ngModel)]="hall.status">

                <option [ngValue]="hallStatus.Available">{{ hallStatusLabel(hallStatus.Available) }}</option>
                <option [ngValue]="hallStatus.Maintenance">{{ hallStatusLabel(hallStatus.Maintenance) }}</option>

            </select>

        </div>

        <div class="form-group">

            <label>{{ 'Halls:Field:Type' | appLocalization }}</label>

            <select [(ngModel)]="hall.type">

                <option [value]="1">{{ hallTypeLabel(1) }}</option>
                <option [value]="2">{{ hallTypeLabel(2) }}</option>
                <option [value]="3">{{ hallTypeLabel(3) }}</option>

            </select>

        </div>

    </div>

    <div class="actions">

        <button class="cancel-btn" (click)="close()">
            {{ 'Cancel' | appLocalization }}
        </button>

        <button class="save-btn" (click)="save()">
            {{ isEditMode
                ? ('Dialog:SaveChanges' | appLocalization)
                : ('Halls:Dialog:AddSubmit' | appLocalization) }}
        </button>

    </div>

</div>
