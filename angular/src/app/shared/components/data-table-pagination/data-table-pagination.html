@if (totalCount() > 0) {
  <nav class="table-pagination" aria-label="Pagination">
    <div class="pagination-summary">
      <span class="pagination-range">{{ rangeLabel() }}</span>
      <span class="pagination-divider" aria-hidden="true">|</span>
      <span class="pagination-meta">{{ pageMetaLabel() }}</span>
    </div>

    <div class="pagination-controls">
      <button
        type="button"
        class="pagination-nav"
        [disabled]="isFirstPage()"
        (click)="goPrevious()"
      >
        <mat-icon>chevron_left</mat-icon>
        <span>{{ 'Pagination:Previous' | appLocalization }}</span>
      </button>

      <div class="pagination-pages" role="group">
        @for (token of visiblePages(); track $index) {
          @if (isEllipsis(token)) {
            <span class="pagination-ellipsis" aria-hidden="true">...</span>
          } @else {
            <button
              type="button"
              class="pagination-page"
              [class.is-active]="token === pageIndex()"
              [attr.aria-current]="token === pageIndex() ? 'page' : null"
              (click)="goToPage(token)"
            >
              {{ token + 1 }}
            </button>
          }
        }
      </div>

      <button
        type="button"
        class="pagination-nav"
        [disabled]="isLastPage()"
        (click)="goNext()"
      >
        <span>{{ 'Pagination:Next' | appLocalization }}</span>
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>
  </nav>
}
