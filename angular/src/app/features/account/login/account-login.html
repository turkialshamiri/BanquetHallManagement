<div class="login-page">
  <div class="login-card">
    <div class="header">
      <h1>تسجيل الدخول</h1>
      <p>أدخل بيانات حسابك للمتابعة</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>اسم المستخدم</label>
        <input
          type="text"
          formControlName="username"
          autocomplete="username"
          [class.invalid]="form.controls.username.touched && form.controls.username.invalid"
        />
        @if (form.controls.username.touched && form.controls.username.invalid) {
          <div class="error">اسم المستخدم مطلوب</div>
        }
      </div>

      <div class="field">
        <label>كلمة المرور</label>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [class.invalid]="form.controls.password.touched && form.controls.password.invalid"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <div class="error">كلمة المرور مطلوبة</div>
        }
      </div>

      <label class="remember">
        <input type="checkbox" formControlName="rememberMe" />
        تذكرني
      </label>

      @if (errorMessage) {
        <div class="alert">
          {{ errorMessage }}
        </div>
      }

      <button type="submit" [disabled]="loading">
        {{ loading ? 'جاري تسجيل الدخول...' : 'تسجيل الدخول' }}
      </button>
    </form>
  </div>
</div>
