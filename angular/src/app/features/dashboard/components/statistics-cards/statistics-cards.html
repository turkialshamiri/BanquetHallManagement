<div class="stats-grid">

    <div class="stat-card halls">

        <div class="card-icon">
            <span>🏛️</span>
        </div>

        <div class="card-content">

            <span class="card-title">
                إجمالي القاعات
            </span>

            <h2>
                {{ totalHalls }}
            </h2>

        </div>

    </div>

    <div class="stat-card bookings">

        <div class="card-icon">
            <span>📅</span>
        </div>

        <div class="card-content">

            <span class="card-title">
                إجمالي الحجوزات
            </span>

            <h2>
                {{ totalBookings }}
            </h2>

        </div>

    </div>

    <div class="stat-card completed">

        <div class="card-icon">
            <span>✅</span>
        </div>

        <div class="card-content">

            <span class="card-title">
                الحجوزات المكتملة
            </span>

            <h2>
                {{ completedBookings }}
            </h2>

        </div>

    </div>

    <div class="stat-card pending">

        <div class="card-icon">
            <span>⏳</span>
        </div>

        <div class="card-content">

            <span class="card-title">
                الحجوزات قيد الانتظار
            </span>

            <h2>
                {{ pendingBookings }}
            </h2>

        </div>

    </div>

</div>
